<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1b1310" />
    <title>estante · estudos de psicoacústica</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231b1310'/><circle cx='16' cy='16' r='9' fill='%23f2c14e'/><circle cx='16' cy='16' r='2' fill='%231b1310'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="layout">
      <aside class="side side-left">
        <header class="brand">
          <h1>estante</h1>
          <p>estudos de psicoacústica</p>
          <div class="session" id="session"></div>
        </header>
        <section class="block" id="peopleBlock" hidden>
          <h2 class="label">quem trouxe</h2>
          <nav class="people" id="people" aria-label="De quem"></nav>
        </section>
        <section class="block" id="tagsBlock" hidden>
          <h2 class="label">temas</h2>
          <nav class="pills" id="tags" aria-label="Temas"></nav>
        </section>
      </aside>

      <main class="feed">
        <form class="composer" id="composer">
          <label class="visually-hidden" for="composerUrl">Link do disco ou da faixa</label>
          <input id="composerUrl" type="url" inputmode="url" autocomplete="off" placeholder="cole um link do Spotify, YouTube ou Bandcamp…" />
          <button class="primary" type="submit">recomendar</button>
        </form>
        <p class="count" id="count" aria-live="polite"></p>
        <section class="posts" id="shelf" aria-label="Recomendações"></section>
      </main>

      <aside class="side side-right" id="rightSide">
        <section class="block">
          <h2 class="label">discos ou faixas</h2>
          <div class="segmented" role="radiogroup" aria-label="Tipo" id="kindFilter">
            <button role="radio" data-kind="" aria-checked="true">tudo</button>
            <button role="radio" data-kind="album" aria-checked="false">discos</button>
            <button role="radio" data-kind="track" aria-checked="false">faixas</button>
          </div>
        </section>
        <section class="block">
          <label class="label" for="search">buscar</label>
          <input id="search" type="search" placeholder="título, artista, comentário" autocomplete="off" />
        </section>
        <section class="block mini-block" id="miniBlock" hidden>
          <h2 class="label">na estante</h2>
          <div class="mini" id="mini"></div>
        </section>
      </aside>
    </div>

    <dialog id="loginDialog" class="sheet">
      <form method="dialog" id="loginForm">
        <h2>entrar na estante</h2>
        <p class="hint">Seu nome, como o grupo te conhece, e o código que circulou no WhatsApp.</p>
        <label>nome<input name="name" required maxlength="40" autocomplete="nickname" /></label>
        <label>código do grupo<input name="code" required type="password" autocomplete="off" /></label>
        <p class="error" id="loginError" role="alert"></p>
        <div class="actions">
          <button value="cancel" formnovalidate class="ghost">cancelar</button>
          <button class="primary" value="default">entrar</button>
        </div>
      </form>
    </dialog>

    <dialog id="addDialog" class="sheet wide">
      <form method="dialog" id="addForm">
        <h2>pôr na estante</h2>
        <label>link <span class="hint">Spotify, YouTube ou Bandcamp. O resto se preenche.</span>
          <input name="url" type="url" inputmode="url" placeholder="https://open.spotify.com/…" />
        </label>
        <div class="preview" id="preview" hidden>
          <img alt="" id="previewCover" />
          <span id="previewStatus"></span>
        </div>
        <fieldset class="segmented" aria-label="Tipo">
          <label><input type="radio" name="kind" value="album" checked /><span>disco</span></label>
          <label><input type="radio" name="kind" value="track" /><span>faixa</span></label>
        </fieldset>
        <div class="grid-2">
          <label>título<input name="title" required maxlength="200" /></label>
          <label>artista<input name="artist" required maxlength="200" /></label>
        </div>
        <div class="grid-2">
          <label>ano<input name="year" inputmode="numeric" pattern="\d{4}" maxlength="4" /></label>
          <label>temas<input name="tags" id="tagsInput" list="tagSuggestions" maxlength="200" placeholder="jazz, ambient" /></label>
        </div>
        <div class="pills small" id="tagPicker"></div>
        <datalist id="tagSuggestions"></datalist>
        <label>por que ouvir<textarea name="description" rows="5" maxlength="4000" placeholder="o que te pegou, em que faixa prestar atenção, com que fone ouvir…"></textarea></label>
        <input type="hidden" name="cover_url" />
        <p class="error" id="addError" role="alert"></p>
        <div class="actions">
          <button value="cancel" formnovalidate class="ghost">cancelar</button>
          <button class="primary" value="default">pôr na estante</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
